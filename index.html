<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Earning Bot - Dashboard</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #c5a059;
            font-size: 22px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-btn {
            background: none;
            border: 1px solid #c5a059;
            color: #c5a059;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .back-btn:active {
            background: #c5a059;
            color: #0b0c10;
        }
        .stats-container {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, #1f2833, #151a21);
            border: 1px solid #c5a059;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.1);
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .stat-label {
            font-size: 15px;
            color: #95a5a6;
        }
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #c5a059;
        }
        .grid-container {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .menu-btn {
            background: #151a21;
            border: 1px solid rgba(197, 160, 89, 0.4);
            border-radius: 12px;
            padding: 20px 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .menu-btn:active {
            transform: scale(0.95);
            border-color: #c5a059;
            background: #1f2833;
        }
        .icon {
            font-size: 24px;
        }
        .task-list-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }
        .task-item {
            background: #151a21;
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .task-item:active {
            background: #1f2833;
            border-color: #c5a059;
        }
        .task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .task-title {
            font-weight: bold;
            color: #ffffff;
            font-size: 16px;
        }
        .task-reward {
            color: #c5a059;
            font-size: 14px;
        }
        .task-status {
            font-size: 13px;
            background: rgba(197, 160, 89, 0.1);
            color: #c5a059;
            padding: 4px 8px;
            border-radius: 5px;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="page-title">Task Earning Bot</h1>
        <button class="back-btn" id="back-button" style="display: none;" onclick="showMainMenu()">Back</button>
    </div>

    <!-- Main Dashboard View -->
    <div id="main-menu-view" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="stats-container">
            <div class="stat-row">
                <span class="stat-label">Total Task Completed</span>
                <span class="stat-value">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Current Balance</span>
                <span class="stat-value">0.00 TK</span>
            </div>
        </div>

        <div class="grid-container">
            <div class="menu-btn" onclick="showTaskListView()"><span class="icon">🎯</span>Task</div>
            <div class="menu-btn"><span class="icon">💼</span>Offerwalls</div>
            <div class="menu-btn"><span class="icon">👥</span>Invite</div>
            <div class="menu-btn"><span class="icon">💰</span>Balance</div>
            <div class="menu-btn"><span class="icon">💳</span>Withdraw</div>
            <div class="menu-btn"><span class="icon">📞</span>Support</div>
        </div>
    </div>

    <!-- 60 Tasks List View -->
    <div id="task-list-view" class="task-list-container" style="display: none;">
        <!-- JavaScript auto-generates 60 tasks here -->
    </div>

    <script>
        function showTaskListView() {
            document.getElementById('main-menu-view').style.display = 'none';
            document.getElementById('task-list-view').style.display = 'flex';
            document.getElementById('back-button').style.display = 'block';
            document.getElementById('page-title').innerText = 'Available Tasks';
            
            const taskContainer = document.getElementById('task-list-view');
            if(taskContainer.innerHTML.trim() === "") {
                let html = "";
                for(let i = 1; i <= 60; i++) {
                    html += `
                        <div class="task-item" onclick="startTask(${i})">
                            <div class="task-info">
                                <div class="task-title">Task ${i}</div>
                                <div class="task-reward">Reward: $0.10</div>
                            </div>
                            <div class="task-status">Start</div>
                        </div>
                    `;
                }
                taskContainer.innerHTML = html;
            }
        }

        function showMainMenu() {
            document.getElementById('main-menu-view').style.display = 'flex';
            document.getElementById('task-list-view').style.display = 'none';
            document.getElementById('back-button').style.display = 'none';
            document.getElementById('page-title').innerText = 'Task Earning Bot';
        }

        <script>
    function showTaskListView() {
        const mainMenu = document.getElementById('main-menu-view');
        if (mainMenu) mainMenu.style.display = 'none';
        
        const taskContainer = document.getElementById('task-list-view');
        taskContainer.style.display = 'flex';
        
        if (taskContainer.innerHTML.trim() === "") {
            let html = "";
            for (let i = 1; i <= 60; i++) {
                html += `
                    <div style="background: #151a21; border: 1px solid rgba(197, 160, 89, 0.3); border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer;" onclick="startTask(${i})">
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <div style="font-weight: bold; color: #ffffff; font-size: 16px;">Task ${i}</div>
                            <div style="color: #c5a059; font-size: 14px;">Reward: $0.10</div>
                        </div>
                        <div style="font-size: 13px; background: rgba(197, 160, 89, 0.1); color: #c5a059; padding: 4px 8px; border-radius: 5px; border: 1px solid rgba(197, 160, 89, 0.3);">Start</div>
                    </div>
                `;
            }
            taskContainer.innerHTML = html;
        }
    }

    function startTask(taskNumber) {
        // টেলিগ্রাম ফ্রেন্ডলি উইন্ডো ইউআরএল সিস্টেম
       window.location.href = "https://t.me_" + taskNumber;

    }
</script>

    </script>
</body>
</html>
