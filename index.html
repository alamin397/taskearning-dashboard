<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Earning Bot - Dashboard</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #c5a059;
            font-size: 22px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-btn {
            background: none;
            border: 1px solid #c5a059;
            color: #c5a059;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .back-btn:active {
            background: #c5a059;
            color: #0b0c10;
        }

        .grid-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        .task-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: linear-gradient(135deg, #1f2833, #151a21);
            border: 1px solid #c5a059;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.1);
            box-sizing: border-box;
        }

        .task-info {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }

        .work-btn {
            background: none;
            border: 1px solid #c5a059;
            color: #c5a059;
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }

        .work-btn:active {
            background: #c5a059;
            color: #0b0c10;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Available Tasks</h1>
        <button class="back-btn" onclick="goBack()">Back</button>
    </div>

    <!-- এই কন্টেইনারের ভেতরে জাভাস্ক্রিপ্ট কোড দিয়ে ১-৬০ টাস্ক অটোমেটিক তৈরি হবে -->
    <div class="grid-container" id="task-list-container"></div>

    <script>
        // ১ থেকে ৬০ পর্যন্ত সিরিয়াল টাস্ক তৈরি করার জাভাস্ক্রিপ্ট লজিক
        document.addEventListener("DOMContentLoaded", () => {
            const taskContainer = document.getElementById("task-list-container");
            
            if (taskContainer) {
                taskContainer.innerHTML = ""; // পেজ রিফ্রেশ হলে আগের ডেটা ক্লিয়ার করার জন্য
                
                for (let i = 1; i <= 60; i++) {
                    const taskCard = document.createElement("div");
                    taskCard.className = "task-card";
                    
                    taskCard.innerHTML = `
                        <div class="task-info">${i}. Task = $0.10</div>
                        <button class="work-btn" onclick="startTask(${i})">Work</button>
                    `;
                    
                    taskContainer.appendChild(taskCard);
                }
            }
        });

        // ব্যাক বাটনের ফাংশন
        function goBack() {
            window.history.back();
        }

        // টাস্ক বাটনে ক্লিক করলে যা হবে
        function startTask(taskId) {
            alert("You clicked on Task " + taskId + ". Proceeding to shortlink...");
            // এখানে পরবর্তীতে শর্টলিংক রিডাইরেকশনের কাজ করা যাবে
        }
    </script>
</body>
</html>
