<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Earning Bot - Dashboard</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #c5a059;
            font-size: 24px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stats-container {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, #1f2833, #151a21);
            border: 1px solid #c5a059;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.1);
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .stat-label {
            font-size: 15px;
            color: #95a5a6;
        }
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #c5a059;
        }
        .grid-container {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .menu-btn {
            background: #151a21;
            border: 1px solid rgba(197, 160, 89, 0.4);
            border-radius: 12px;
            padding: 20px 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .menu-btn:active {
            transform: scale(0.95);
            border-color: #c5a059;
            background: #1f2833;
        }
        .icon {
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Task Earning Bot</h1>
    </div>

    <div class="stats-container">
        <div class="stat-row">
            <span class="stat-label">Total Task Completed</span>
            <span class="stat-value">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Current Balance</span>
            <span class="stat-value">0.00 TK</span>
        </div>
    </div>

    <div class="grid-container">
        <div class="menu-btn"><span class="icon">🎯</span>Task</div>
        <div class="menu-btn"><span class="icon">💼</span>Offerwalls</div>
        <div class="menu-btn"><span class="icon">👥</span>Invite</div>
        <div class="menu-btn"><span class="icon">💰</span>Balance</div>
        <div class="menu-btn"><span class="icon">💳</span>Withdraw</div>
        <div class="menu-btn"><span class="icon">📞</span>Support</div>
    </div>

</body>
</html>

<!-- ১. ৬০টি টাস্কের লিস্ট দেখানোর কন্টেইনার (আগের ফাইলের মেইন কন্টেইনারের নিচে বসাবেন) -->
<div id="task-list-view" style="display: none; width: 100%; max-width: 400px; flex-direction: column; gap: 10px; margin-top: 20px;">
    <!-- জাভাস্ক্রিপ্ট এখানে অটোমেটিক ৬০টি টাস্ক তৈরি করবে -->
</div>

<script>
    // Task বাটনে onclick="showTaskListView()" ফাংশন হিসেবে এটি কাজ করবে
    function showTaskListView() {
        const mainMenu = document.getElementById('main-menu-view');
        if (mainMenu) mainMenu.style.display = 'none';
        
        const taskContainer = document.getElementById('task-list-view');
        taskContainer.style.display = 'flex';
        
        if (taskContainer.innerHTML.trim() === "") {
            let html = "";
            for (let i = 1; i <= 60; i++) {
                html += `
                    <div style="background: #151a21; border: 1px solid rgba(197, 160, 89, 0.3); border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer;">
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <div style="font-weight: bold; color: #ffffff; font-size: 16px;">Task ${i}</div>
                            <div style="color: #c5a059; font-size: 14px;">Reward: $0.10</div>
                        </div>
                        <div style="font-size: 13px; background: rgba(197, 160, 89, 0.1); color: #c5a059; padding: 4px 8px; border-radius: 5px; border: 1px solid rgba(197, 160, 89, 0.3);">Start</div>
                    </div>
                `;
            }
            taskContainer.innerHTML = html;
        }
    }
</script>
